# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# ============================================================================
# THIS BRANCH BUILDS THE DISPLAY DEVICE ONLY. IT NEVER MERGES INTO THE
# KEYBOARD BRANCHES.
# ============================================================================
# The remote status display (docs/remote-display-plan.md) is permanently
# separate hardware: a Seeed XIAO nRF52840 + nice!view with no keys, no split
# link and no host. It shares nothing with the Charybdis halves except this
# repository.
#
# The keyboard's own entries (charybdis_left / charybdis_right / the
# charybdis_right_debug hang-hunt build / its settings_reset) are DELIBERATELY
# absent here, and must not be re-added. Two reasons:
#   1. GitHub Actions fails the whole matrix job set when any leg fails, so a
#      broken scanner build would block flashing the daily-driver keyboard --
#      an experimental side project holding the working keyboard hostage.
#   2. Nothing on this branch can affect the keyboard images, so rebuilding
#      them here only burns CI minutes and produces confusable artifacts.
# Build the keyboard from master (or its own branch); build the display here.
---
include:
  # --- Remote status display (Phase 4, docs/remote-display-plan.md) ---
  # Standalone keyless BLE-observer device: Seeed XIAO nRF52840 + nice!view.
  #
  # Board id must be the long unambiguous form `xiao_ble/nrf52840/zmk`: that
  # variant is ZMK's board *extension* (app/boards/seeed/xiao_ble), which adds
  # ZMK_USB/ZMK_BLE, UF2 output, NVS settings, retention boot mode and the
  # battery divider. Plain `xiao_ble` builds but silently loses all of it -- and
  # it also loses `&xiao_serial { status = "disabled"; }`, which is what frees
  # P1.12 (D7) for the display chip select. See the CS comment in
  # config/boards/shields/dispscan/boards/xiao_ble_nrf52840_zmk.overlay.
  #
  # SHIELD NAME: `dispscan`, no underscore, deliberately. ZMK's
  # app/boards/post_boards_shields.cmake treats every underscore-trimmed prefix
  # of a shield name as an extra overlay/conf/keymap candidate, so the earlier
  # name `charybdis_scanner` also matched `charybdis` and silently merged the
  # KEYBOARD's config/charybdis.conf into this image. Never reintroduce an
  # underscore here.
  #
  # SHIELD ORDER IS LOAD-BEARING: dispscan defines the `nice_view_spi` bus label
  # that the in-tree nice_view shield's overlay attaches the panel to, so it
  # must come FIRST.
  - board: xiao_ble/nrf52840/zmk
    shield: dispscan nice_view
    artifact-name: dispscan

  # --- Recovery image for the display device ---
  # This device has NO KEYS, therefore no `&bt_clr` behaviour and no way to
  # clear a bond from the firmware. ZMK still advertises it connectably as a HID
  # peripheral whenever its active profile is open (app/src/ble.c
  # update_advertising -> ZMK_ADV_CONN), so a user who spots "CharyScan" in
  # their OS Bluetooth panel can pair with it -- Just Works, since
  # ZMK_BLE_PASSKEY_ENTRY is off -- and leave a stale bond behind. Without this
  # artifact the only recovery would be a full erase over SWD/UF2.
  #
  # ZMK's in-tree settings_reset shield (app/boards/shields/settings_reset)
  # wipes NVS on boot and disables both BLE and the display for the reset image,
  # so it is board-agnostic and costs nothing to carry. Flash this .uf2, let it
  # boot once, then flash the dispscan image again.
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: dispscan_settings_reset
