# Central-only overlay (loaded for the charybdis_right shield). The remote
# status-display broadcaster (config/status_adv/) must be enabled ONLY on the
# central: its Kconfig `depends on !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`, so
# setting it in the shared charybdis.conf makes the left (peripheral) build emit
# an unmet-dependency Kconfig warning. Enabling it here keeps the left build
# clean. FETCHING+PROXY (needed to pull the peripheral battery) live in the
# shared charybdis.conf.
CONFIG_CHARYBDIS_STATUS_ADV=y
