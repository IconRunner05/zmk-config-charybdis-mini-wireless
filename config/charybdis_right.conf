# Central-only overlay (loaded for the charybdis_right shield). Enables the
# status-display broadcaster (config/status_adv/) ONLY on the central: its
# Kconfig `depends on !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`, so a shared =y in
# charybdis.conf makes the left (peripheral) build warn on an unmet dependency.
# FETCHING+PROXY (needed to pull the peripheral battery) live in charybdis.conf.
# Previously this was set via an uncommitted build-time on.conf, so plain CI
# artifacts shipped with the broadcaster OFF (default n) -> display saw no beacon.
CONFIG_CHARYBDIS_STATUS_ADV=y
