# dispscan — Kconfig for the keyless BLE-observer status display.
#
# SLICE SCOPE: hardware plumbing only. No BLE scanning code, no payload
# parsing. The success criterion is a clean CI build that, when flashed, lights
# the nice!view and shows the placeholder screen from custom_status_screen.c.
#
# WHY THE SHIELD IS CALLED `dispscan` AND NOT `charybdis_scanner`
# --------------------------------------------------------------
# ZMK's app/boards/post_boards_shields.cmake derives `shield_candidate_names` by
# repeatedly popping trailing underscore-separated segments off the shield name:
#
#     string(REPLACE "_" ";" S_PIECES ${s})
#     while(NOT S_PIECES STREQUAL "")
#         list(POP_BACK S_PIECES)
#         list(JOIN S_PIECES "_" s_substr)
#         ...
#         list(APPEND shield_candidate_names ${s_substr})
#     endwhile()
#
# A shield named `charybdis_scanner` therefore ALSO matches `charybdis`, and the
# ZMK_CONFIG search then picks up config/charybdis.conf — the KEYBOARD's config —
# and merges it into this build. Worse, the conf loop appends EVERY match rather
# than stopping at the first, so the keyboard config could not be shadowed, only
# overridden afterwards by a second "antidote" fragment. That antidote existed;
# it is gone now.
#
# `dispscan` contains NO underscore, so the while loop pops its single segment,
# produces the empty string, and breaks immediately. It generates zero prefix
# candidates and the entire collision surface disappears. DO NOT reintroduce an
# underscore into this shield's name.
#
# Direct consequence: this build no longer inherits ANY of charybdis.conf —
# not ZMK_SLEEP, ZMK_POINTING, ZMK_KEYBOARD_NAME, BT_CTLR_TX_PWR_PLUS_8,
# ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING/PROXY, ZMK_BLE_EXPERIMENTAL_*,
# ZMK_BATTERY_REPORTING, nor BT_PERIPHERAL_PREF_*. Every symbol below is set
# because THIS device needs it, not to undo someone else's setting.

# --- Identity ----------------------------------------------------------------
# The scanner is a separate BLE device from the keyboard and must never
# impersonate it (a host paired with both would otherwise show two identical
# entries). Nothing sets this for us any more, so set it explicitly here rather
# than relying on the Kconfig.defconfig default — a `.conf` assignment is the
# unambiguous single source. Max 16 chars (CONFIG_BT_DEVICE_NAME_MAX is
# defaulted to 16 by app/Kconfig, and app/src/ble.c has a BUILD_ASSERT on it).
CONFIG_ZMK_KEYBOARD_NAME="CharyScan"

# --- BLE ---------------------------------------------------------------------
# CONFIG_ZMK_BLE is inherited as `y` from the board defconfig
# (app/boards/seeed/xiao_ble/xiao_ble_zmk_defconfig) and is DELIBERATELY left
# alone: bt_enable() is called only from ZMK's own app/src/ble.c, so turning it
# off would mean owning Bluetooth stack init ourselves — and without bt_enable()
# the observer role this device exists for cannot start either.
#
# The cost is that ZMK also advertises this device connectably, forever:
# app/src/ble.c update_advertising() picks ZMK_ADV_CONN whenever the active
# profile is open or unconnected, and starts BT_LE_ADV_PARAM(BT_LE_ADV_OPT_CONN
# | BT_LE_ADV_OPT_USE_NAME | ...). There is no Kconfig to suppress that while
# keeping ZMK_BLE=y. Assessed and accepted for this slice, because:
#   * ZMK_BLE_PASSKEY_ENTRY defaults n (app/Kconfig) and nothing here implies it
#     any more — the old implication came in via charybdis.conf's
#     ZMK_BLE_EXPERIMENTAL_FEATURES -> ZMK_BLE_EXPERIMENTAL_SEC ->
#     `imply BT_SMP_ALLOW_UNAUTH_OVERWRITE` -> `imply ZMK_BLE_PASSKEY_ENTRY`,
#     and that leak is gone with the rename. So a curious user who pairs from
#     their OS Bluetooth panel gets Just Works, NOT an unsatisfiable PIN prompt.
#   * a stale bond is now recoverable: build.yaml carries a `settings_reset`
#     entry for xiao_ble/nrf52840/zmk precisely because this device has no keys
#     and therefore no `&bt_clr` behaviour to invoke.
# Revisit when the scanner gets real scanning: at that point suppressing the
# connectable advert (or moving off ZMK's BLE layer entirely) is worth the work.
CONFIG_BT=y

# The one addition that makes this device an observer. BT_OBSERVER (scanning)
# and BT_PERIPHERAL (advertising, selected by ZMK_BLE at app/Kconfig:165) are
# independent Zephyr roles and coexist; the controller interleaves them. Nothing
# scans yet in this slice -- the option is here so the plumbing build already
# carries the correct link-layer feature set and its RAM/flash cost is visible
# from the first CI run rather than appearing later and blowing the image budget.
CONFIG_BT_OBSERVER=y

# --- Not a keyboard ----------------------------------------------------------
# Standalone device: no split halves, no peripheral, no central.
CONFIG_ZMK_SPLIT=n
# ZMK Studio hard-requires zmk,physical-layout nodes -- app/src/physical_layouts.c
# has a BUILD_ASSERT that fails the build outright for a keyboard that has none,
# and this device has none (it has no keys to lay out). Also keeps PM_DEVICE
# out: app/src/studio/Kconfig `select PM_DEVICE  # Needed for physical layout
# switching` is the only remaining thing in this build that would pull it in.
CONFIG_ZMK_STUDIO=n

# --- Power -------------------------------------------------------------------
# CONFIG_ZMK_SLEEP is NOT set and is now correctly `n` by default (app/Kconfig:404
# has no `default y`). Previously it could not be turned off, because
# charybdis.conf leaked both ZMK_SLEEP=y and ZMK_IDLE_SLEEP_TIMEOUT=900000 into
# this build and ZMK_IDLE_SLEEP_TIMEOUT is declared inside `if ZMK_SLEEP`
# (app/Kconfig:411-420) -- disabling ZMK_SLEEP would have stranded that
# assignment, which Zephyr reports as a Kconfig warning and hence a build
# failure. With the leak gone, sleep is simply off, and the old
# `CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2147483647` hack is deleted: that symbol no
# longer exists in this build at all, so assigning it would itself be a warning.
# Net effect: activity.c's `if (inactive_time > MAX_SLEEP_MS)` branch is
# #if'd out entirely, sys_poweroff() is unreachable, and the device stays up.
#
# CONFIG_PM_DEVICE is deliberately NOT asserted, even though this device wants
# nothing suspended. It is already `n`: the only things that turn it on are
# ZMK_SLEEP (`select ZMK_PM_DEVICE_SUSPEND_RESUME` + `config PM_DEVICE default y`
# inside `if ZMK_SLEEP`), ZMK_PM_SOFT_OFF (`select PM_DEVICE`, default n, needs a
# zmk,soft-off devicetree node we do not have) and ZMK_STUDIO (`select
# PM_DEVICE`, explicitly n above). Writing `CONFIG_PM_DEVICE=n` would buy nothing
# and would convert any future `select PM_DEVICE` into an "assigned n but got y"
# Kconfig warning -> hard build failure. Leaving it unset lets such a select
# succeed quietly instead of breaking CI. Note the historical hazard is gone
# either way: app/src/pm.c only defines zmk_pm_suspend_devices() under
# CONFIG_PM_DEVICE_SYSTEM_MANAGED, and activity.c only calls it under
# CONFIG_ZMK_SLEEP -- both off, so there is no link-time dependency left.

# --- Idle / activity ---------------------------------------------------------
# THIS DEVICE MUST NEVER GO IDLE. app/src/activity.c runs a 1 Hz timer from boot
# and, at `inactive_time > CONFIG_ZMK_IDLE_TIMEOUT` (app/src/activity.c:91,
# default 30000 ms per app/Kconfig:400-402 -- and note it is NOT gated by
# ZMK_SLEEP), raises ZMK_ACTIVITY_IDLE. The only inputs that ever reset the
# clock are zmk_position_state_changed, zmk_sensor_event and (under
# ZMK_POINTING) Zephyr input events -- app/src/activity.c:109-123. A keyless,
# hostless, pointing-device-less board produces none of them, so 30 s after boot
# it latches into IDLE permanently and nothing can ever bring it back to ACTIVE.
#
# What actually reacts to IDLE in THIS build:
#   * app/src/battery.c:167-179 stops the battery report timer on IDLE and only
#     restarts it on ACTIVE -- i.e. battery reporting would die 30 s in, forever.
#   * app/src/display/main.c:168-193 would blank the panel -- but ONLY under
#     CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE, see the note below.
#   * backlight.c / rgb_underglow.c / indicators -- none compiled here.
#
# Pushing the threshold to INT32_MAX keeps the device in ZMK_ACTIVITY_ACTIVE for
# ~24.8 days of uptime; the comparison is a plain int32 subtraction
# (`int32_t inactive_time = current - activity_last_uptime`), so there is no
# overflow hazard, and after wrap the worst case is a single spurious IDLE.
# DELIBERATE FOR THE PLUMBING SLICE. Replace this with activity-driven sleep
# once the scanner has a real event source to feed the activity subsystem from.
CONFIG_ZMK_IDLE_TIMEOUT=2147483647

# Belt and braces on top of the above: keep the panel powered unconditionally.
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE is `default y if SSD1306`
# (app/src/display/Kconfig:12-14) -- this panel is an LS0XX, so it is already n,
# and ZMK's own app/boards/shields/nice_view/nice_view.conf sets it to n too.
# Asserting it here means the "display goes dark and never wakes" failure mode
# cannot reappear if either of those upstream facts changes, and it documents
# that the choice is intentional rather than inherited. Merge order note: shield
# .conf files are merged in SHIELD list order, so nice_view.conf lands AFTER
# this file -- both say n, so there is no conflict either way.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- Buses -------------------------------------------------------------------
# Both are already implied (LS0XX selects SPI; the board defconfig sets GPIO),
# but stated explicitly so a future edit that drops the display cannot silently
# take the buses with it.
CONFIG_SPI=y
CONFIG_GPIO=y

# --- Display -----------------------------------------------------------------
# Belt and braces: the nice_view shield's own .conf sets ZMK_DISPLAY too, but
# the scanner must not depend on which display shield it is paired with.
CONFIG_ZMK_DISPLAY=y

# Use OUR status screen (custom_status_screen.c, compiled by this shield's
# CMakeLists.txt) instead of ZMK's built-in one.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CRITICAL. nice_view's Kconfig.defconfig does
# `config ZMK_DISPLAY_STATUS_SCREEN_CUSTOM imply NICE_VIEW_WIDGET_STATUS`,
# which would compile ZMK's own custom_status_screen.c -- a duplicate definition
# of zmk_display_status_screen(), and one that renders LOCAL keyboard state
# (battery / output / layer / WPM), all of which is meaningless on a device with
# no keys and no host. Setting it `n` makes the guard in
# app/boards/shields/nice_view/CMakeLists.txt
# (`if(CONFIG_ZMK_DISPLAY AND CONFIG_NICE_VIEW_WIDGET_STATUS)`) exclude those
# sources, leaving our screen as the only definition. `imply` is a weak default,
# so an explicit `n` wins without a Kconfig warning.
#
# CAVEAT: NICE_VIEW_WIDGET_STATUS is declared inside `if SHIELD_NICE_VIEW`, so
# it only exists when nice_view is in the shield list. Assigning an undefined
# symbol is a Kconfig warning, and Zephyr turns warnings into build failures --
# so this shield must always be built as `dispscan nice_view` (see build.yaml).
# Drop this line first if the display shield ever changes.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# LVGL: ZMK_DISPLAY implies LV_CONF_MINIMAL, under which the label widget is
# OFF by default. Our placeholder screen is a single lv_label.
CONFIG_LV_USE_LABEL=y
